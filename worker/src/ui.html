<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Relay</title>
<style>
:root { --bg:#faf9f6; --panel:#fff; --line:#e4e1d8; --text:#1d1c19; --muted:#6f6b62; --accent:#b8562f; --ok:#2f7d4f; --warn:#a8691a; --bad:#b3372f; --code:#f1efe8; }
@media (prefers-color-scheme: dark) { :root { --bg:#191816; --panel:#22211e; --line:#38362f; --text:#ecebe6; --muted:#9d998e; --accent:#e08a5f; --ok:#6fc08d; --warn:#dba54e; --bad:#e8776f; --code:#2b2a26; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; height:100dvh; display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
header h1 { font-size:15px; margin:0; flex:1; }
header span { color:var(--muted); font-size:13px; }
main { flex:1; display:flex; min-height:0; }
aside { width:300px; border-right:1px solid var(--line); overflow:auto; flex-shrink:0; }
section { flex:1; display:flex; flex-direction:column; min-width:0; }
button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button:disabled { opacity:.5; cursor:default; }
input, textarea { font:inherit; width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
.item { padding:10px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
.item.on { background:var(--panel); box-shadow:inset 3px 0 var(--accent); }
.item b { display:block; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item small, .meta { color:var(--muted); font-size:12px; }
.badge { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid currentColor; }
.running { color:var(--warn); } .idle { color:var(--ok); } .failed { color:var(--bad); } .local { color:var(--accent); }
#bar { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
#bar .grow { flex:1; min-width:0; }
#log { flex:1; overflow:auto; padding:16px; }
.msg { max-width:820px; margin:0 auto 14px; white-space:pre-wrap; overflow-wrap:anywhere; }
.msg.user { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
.msg.tool { color:var(--muted); font:12px/1.4 ui-monospace, monospace; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.msg.err { color:var(--bad); }
code { background:var(--code); padding:2px 6px; border-radius:4px; font:13px ui-monospace, monospace; user-select:all; }
form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
form textarea { resize:none; height:44px; }
.new { padding:12px 16px; border-bottom:1px solid var(--line); display:grid; gap:8px; }
#empty { margin:auto; color:var(--muted); text-align:center; padding:24px; }
@media (max-width:720px) { main { flex-direction:column; } aside { width:auto; max-height:38dvh; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<header><h1>Claude Relay</h1><span id="who"></span><button id="signout" hidden>Sign out</button></header>
<main>
	<aside>
		<div class="new">
			<input id="repo" placeholder="Repo https URL (optional)">
			<input id="first" placeholder="First prompt">
			<button class="primary" id="create">New session</button>
		</div>
		<div id="list"></div>
	</aside>
	<section>
		<div id="empty">Pick a session, or start one.</div>
		<div id="bar" hidden><div class="grow"><b id="title"></b><div class="meta" id="sub"></div></div><span id="state"></span><button id="stop" hidden>Interrupt</button></div>
		<div id="log" hidden></div>
		<form id="send" hidden><textarea id="prompt" placeholder="Next turn, run in the cloud"></textarea><button class="primary">Send</button></form>
	</section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = null, current = null, socket = null, info = null;
try { token = localStorage.getItem("relay-token"); } catch {}

async function api(method, path, body) {
	const response = await fetch("/api" + path, {
		method,
		headers: { authorization: "Bearer " + token, ...(body ? { "content-type": "application/json" } : {}) },
		body: body ? JSON.stringify(body) : undefined,
	});
	const data = await response.json().catch(() => ({}));
	if (!response.ok) throw new Error(data.error || response.statusText);
	return data;
}

function el(tag, cls, text) {
	const node = document.createElement(tag);
	if (cls) node.className = cls;
	if (text !== undefined) node.textContent = text;
	return node;
}

async function signIn() {
	while (true) {
		if (!token) token = (prompt("Login token") || "").trim();
		if (!token) continue;
		try {
			const me = await api("GET", "/me");
			try { localStorage.setItem("relay-token", token); } catch {}
			$("who").textContent = me.name + (me.hasClaudeToken ? "" : " · no Claude token: run relay login");
			$("signout").hidden = false;
			return;
		} catch { token = null; }
	}
}

async function refreshList() {
	const sessions = await api("GET", "/sessions");
	const list = $("list");
	list.replaceChildren(...sessions.map((s) => {
		const item = el("div", "item" + (s.id === current ? " on" : ""));
		item.append(el("b", "", s.title), el("small", "", `${s.status} · ${s.holder || "nobody driving"} · ${s.owner}`));
		item.onclick = () => open(s.id);
		return item;
	}));
}

function showState() {
	if (!info) return;
	$("title").textContent = info.title;
	$("sub").textContent = [info.repo, info.branch].filter(Boolean).join(" · ") || "no repository";
	const state = $("state");
	state.replaceChildren();
	const local = info.holder && info.holder.kind === "local";
	state.append(el("span", "badge " + (local ? "local" : info.status),
		local ? `local: ${info.holder.user}${info.holder.host ? " @ " + info.holder.host : ""}` : info.status));
	$("stop").hidden = info.status !== "running";
	const busy = info.status === "running" || local;
	$("prompt").disabled = busy;
	$("send").querySelector("button").disabled = busy;
	$("prompt").placeholder = local ? "Being driven from a terminal; you are watching live" : busy ? "Working…" : "Next turn, run in the cloud";
}

function showEntry({ subpath, entry }) {
	if (subpath || entry.isMeta || entry.isSidechain || !entry.message) return;
	const log = $("log");
	const pinned = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
	const content = entry.message.content;
	const blocks = typeof content === "string" ? [{ type: "text", text: content }] : content || [];
	for (const block of blocks) {
		if (block.type === "text" && block.text && block.text.trim()) {
			log.append(el("div", "msg " + entry.type, block.text.trim()));
		} else if (block.type === "tool_use") {
			const input = block.input || {};
			log.append(el("div", "msg tool", "⏵ " + block.name + " " + (input.command || input.file_path || input.pattern || input.description || "")));
		}
	}
	if (pinned) log.scrollTop = log.scrollHeight;
}

function open(id) {
	current = id;
	if (socket) { socket.onclose = null; socket.close(); }
	for (const part of ["bar", "log", "send"]) $(part).hidden = false;
	$("empty").hidden = true;
	$("log").replaceChildren();
	info = null;
	let last = 0;
	const connect = () => {
		const scheme = location.protocol === "https:" ? "wss:" : "ws:";
		socket = new WebSocket(`${scheme}//${location.host}/api/sessions/${id}/ws?after=${last}&token=${encodeURIComponent(token)}`);
		socket.onmessage = (event) => {
			const message = JSON.parse(event.data);
			if (message.type === "state") {
				info = message.info;
				showState();
				if (info.lastError && info.status === "failed") $("log").append(el("div", "msg err", info.lastError));
				refreshList();
			} else if (message.type === "entry" && message.seq > last) {
				last = message.seq;
				showEntry(message);
			}
		};
		socket.onclose = () => { if (current === id) setTimeout(connect, 2000); };
	};
	connect();
	refreshList();
}

$("create").onclick = async () => {
	try {
		const created = await api("POST", "/sessions", { repo: $("repo").value.trim() || undefined, prompt: $("first").value.trim() || undefined });
		$("first").value = "";
		if (created.warning) alert(created.warning);
		open(created.id);
	} catch (error) { alert(error.message); }
};
$("send").onsubmit = async (event) => {
	event.preventDefault();
	const text = $("prompt").value.trim();
	if (!text) return;
	try { await api("POST", `/sessions/${current}/turns`, { prompt: text }); $("prompt").value = ""; }
	catch (error) { alert(error.message); }
};
$("prompt").onkeydown = (event) => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("send").requestSubmit(); } };
$("stop").onclick = () => api("POST", `/sessions/${current}/interrupt`, {}).catch((error) => alert(error.message));
$("signout").onclick = () => { try { localStorage.removeItem("relay-token"); } catch {} location.reload(); };

signIn().then(() => { refreshList(); setInterval(refreshList, 15000); });
</script>
</body>
</html>
